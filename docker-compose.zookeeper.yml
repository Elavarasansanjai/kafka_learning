version: "3.9"

networks:
  kafka-net:
    driver: bridge

services:
  # ---------- ZooKeeper Ensemble ----------
  zookeeper-1:
    image: zookeeper:3.9.2
    container_name: zookeeper-1
    hostname: zookeeper-1
    networks:
      - kafka-net
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
      # optional: allow connections from any IP (useful for local dev)
      ZOO_4LW_COMMANDS_WHITELIST: "mrmlist,conf,ruok"
    volumes:
      - zk1_data:/data
      - zk1_datalog:/datalog

  zookeeper-2:
    image: zookeeper:3.9.2
    container_name: zookeeper-2
    hostname: zookeeper-2
    networks:
      - kafka-net
    ports:
      - "2182:2181"
    environment:
      ZOO_MY_ID: 2
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    volumes:
      - zk2_data:/data
      - zk2_datalog:/datalog

  zookeeper-3:
    image: zookeeper:3.9.2
    container_name: zookeeper-3
    hostname: zookeeper-3
    networks:
      - kafka-net
    ports:
      - "2183:2181"
    environment:
      ZOO_MY_ID: 3
      ZOO_SERVERS: server.1=zookeeper-1:2888:3888;2181 server.2=zookeeper-2:2888:3888;2181 server.3=zookeeper-3:2888:3888;2181
    volumes:
      - zk3_data:/data
      - zk3_datalog:/datalog

  # ---------- Kafka Brokers (ZooKeeper mode) ----------
  kafka-zk-1:
    image: apache/kafka:3.9.1
    container_name: kafka-zk-1
    hostname: kafka-zk-1
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - kafka-net
    ports:
      - "2028:2028"   # SASL_PLAINTEXT listener (matching your server.properties)
    environment:
      # basic broker identity
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker
      # Zookeeper connection string (all three nodes)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      # Listeners – we expose only the SASL_PLAINTEXT listener you configured
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:2028
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://10.55.66.138:2028
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      # SASL/PLAIN authentication (matches your `kafkaZkClient.js`)
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="AdminP@ssw0rd"
        user_admin="AdminP@ssw0rd"
        user_elavarasan="Sanjay@12";
      # Misc sane defaults
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /kafka/data
    volumes:
      - kafka_zk1_data:/kafka/data

  kafka-zk-2:
    image: apache/kafka:3.9.1
    container_name: kafka-zk-2
    hostname: kafka-zk-2
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - kafka-net
    ports:
      - "2029:2028"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:2028
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://10.55.66.138:2029
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="AdminP@ssw0rd"
        user_admin="AdminP@ssw0rd"
        user_elavarasan="Sanjay@12";
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /kafka/data
    volumes:
      - kafka_zk2_data:/kafka/data

  kafka-zk-3:
    image: apache/kafka:3.9.1
    container_name: kafka-zk-3
    hostname: kafka-zk-3
    depends_on:
      - zookeeper-1
      - zookeeper-2
      - zookeeper-3
    networks:
      - kafka-net
    ports:
      - "2030:2028"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      KAFKA_LISTENERS: SASL_PLAINTEXT://0.0.0.0:2028
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://10.55.66.138:2030
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_SASL_JAAS_CONFIG: |
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="admin"
        password="AdminP@ssw0bd"
        user_admin="AdminP@ssw0bd"
        user_elavarasan="Sanjay@12";
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: /kafka/data
    volumes:
      - kafka_zk3_data:/kafka/data

  # ---------- Optional UI for ZooKeeper‑Kafka ----------
  kafka-ui-zk:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-zk
    depends_on:
      - kafka-zk-1
      - kafka-zk-2
      - kafka-zk-3
    networks:
      - kafka-net
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: zk-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-zk-1:2028,kafka-zk-2:2028,kafka-zk-3:2028
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper-1:2181,zookeeper-2:2181,zookeeper-3:2181
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  zk1_data:
  zk1_datalog:
  zk2_data:
  zk2_datalog:
  zk3_data:
  zk3_datalog:
  kafka_zk1_data:
  kafka_zk2_data:
  kafka_zk3_data:
