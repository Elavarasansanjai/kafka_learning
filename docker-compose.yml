services:

  kafka-1:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-1:19092,EXTERNAL://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - CLUSTER_ID=abcdefghijklmnopqrstuv
    volumes:
      - kafka_1_data:/var/lib/kafka/data

  kafka-2:
    image: apache/kafka:3.7.0
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:19094,EXTERNAL://:9094,CONTROLLER://:9095
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-2:19094,EXTERNAL://localhost:9094
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - CLUSTER_ID=abcdefghijklmnopqrstuv
    volumes:
      - kafka_2_data:/var/lib/kafka/data

  kafka-3:
    image: apache/kafka:3.7.0
    ports:
      - "9096:9096"
    environment:
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=INTERNAL://:19096,EXTERNAL://:9096,CONTROLLER://:9097
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka-3:19096,EXTERNAL://localhost:9096
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9095,3@kafka-3:9097
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - CLUSTER_ID=abcdefghijklmnopqrstuv
    volumes:
      - kafka_3_data:/var/lib/kafka/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local-kraft-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-1:19092,kafka-2:19094,kafka-3:19096
      - DYNAMIC_CONFIG_ENABLED=true
  app:
    build: .
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
      - redis
      - mongo
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3008:3008"
      - "3009:3009"
      - "3010:3010"
    environment:
      - KAFKA_BROKERS=kafka-1:19092,kafka-2:19094,kafka-3:19096
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/kafka_learning

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  mongo_data: